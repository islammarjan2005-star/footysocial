<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footy Social - Football Party Games</title>
    <style rel="stylesheet" crossorigin>@import"https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&family=Oswald:wght@500;600;700&display=swap";
*{box-sizing:border-box}
:root{--bg-primary: #f5c542;--bg-secondary: #ffe066;--bg-light: #fff8dc;--bg-card: #ffffff;--bg-board: #2d5a3d;--accent-red: #e63946;--accent-blue: #2196f3;--accent-yellow: #ffc107;--accent-green: #4caf50;--accent-orange: #ff6b35;--accent-purple: #9c27b0;--player-red: #d32f2f;--player-blue: #1976d2;--text-primary: #1a1a2e;--text-secondary: #333333;--text-muted: #666666;--text-light: #ffffff;--border-dark: #8b4513;--border-light: #daa520;--shadow-pop: 0 8px 25px rgba(0, 0, 0, .25);--shadow-card: 0 4px 15px rgba(0, 0, 0, .2);--font-display: "Fredoka One", "Oswald", cursive;--font-body: "Nunito", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;font-family:var(--font-body);line-height:1.5;font-weight:400;color-scheme:light;color:var(--text-primary);background:var(--bg-primary);font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{margin:0;padding:0;min-height:100vh;overflow-x:hidden}
body{display:block;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.3) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.2) 0%,transparent 40%),radial-gradient(circle,rgba(255,107,53,.1) 2px,transparent 2px),linear-gradient(180deg,#ffd54f,#f5c542 30%,#ffb300 70%,#f5c542);background-size:100% 100%,100% 100%,30px 30px,100% 100%;background-attachment:fixed}
#root{min-height:100vh}
h1,h2,h3,h4,h5,h6{margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
p{margin:0}
button{font-family:var(--font-body);cursor:pointer;border:none;outline:none}
button:active{transform:scale(.98)}
.panel{background:#fff;border:4px solid var(--border-dark);border-radius:20px;box-shadow:var(--shadow-pop),inset 0 -4px #0000001a;position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,.3) 50%,transparent 100%);pointer-events:none;border-radius:16px 16px 0 0}
.gloss{position:relative;overflow:hidden}
.gloss:before{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.2) 50%,transparent 100%);pointer-events:none;z-index:1}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg-light);border-radius:4px}
::-webkit-scrollbar-thumb{background:var(--accent-orange);border-radius:4px;border:2px solid var(--bg-light)}
::-webkit-scrollbar-thumb:hover{background:var(--accent-red)}
@keyframes float{0%,to{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bounce{0%,to{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes wiggle{0%,to{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.2)}to{transform:scale(1)}}
@keyframes pulse-glow{0%,to{box-shadow:0 0 20px #4caf5080}50%{box-shadow:0 0 40px #4caf50cc}}
@keyframes shimmer{0%{background-position:-200% center}to{background-position:200% center}}
@keyframes confetti-fall{0%{transform:translateY(-100vh) rotate(0);opacity:1}to{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes slide-up{0%{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes scale-in{0%{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes card-flip{0%{transform:perspective(1000px) rotateY(0)}to{transform:perspective(1000px) rotateY(180deg)}}
@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}
.perspective-container{perspective:1500px;transform-style:preserve-3d}
.setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.back-to-home{position:absolute;top:20px;left:20px;display:flex;align-items:center;gap:8px;padding:10px 20px;background:#fff;border:3px solid var(--border-dark);border-radius:50px;font-weight:700;font-size:14px;color:var(--text-secondary);cursor:pointer;transition:all .3s ease;box-shadow:0 4px #6b3000,0 6px 15px #00000026;z-index:100}
.back-to-home:hover{transform:translateY(-2px);box-shadow:0 6px #6b3000,0 8px 20px #0003;color:var(--accent-red)}
.back-to-home:active{transform:translateY(1px);box-shadow:0 2px #6b3000,0 4px 10px #0000001a}
.back-arrow{font-size:18px;transition:transform .3s ease}
.back-to-home:hover .back-arrow{transform:translate(-3px)}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;bottom:-20px;width:20px;height:20px;background:var(--accent-orange);border-radius:50%;opacity:.8;animation:float-up 6s ease-in-out infinite}
.particle:before{content:"⚽";font-size:16px}
@keyframes float-up{0%{transform:translateY(0) rotate(0) scale(1);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-100vh) rotate(360deg) scale(.5);opacity:0}}
.setup-card{background:#fff;border:5px solid var(--border-dark);border-radius:30px;padding:40px;max-width:450px;width:100%;text-align:center;animation:scale-in .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 15px 40px #00000040,inset 0 -5px #0000001a;position:relative;overflow:hidden}
.setup-card:before{content:"";position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,.25) 50%,transparent 100%);pointer-events:none;border-radius:25px 25px 0 0;z-index:0}
.logo{margin-bottom:25px}
.logo-icon{width:100px;height:100px;margin:0 auto 15px;background:linear-gradient(135deg,var(--accent-red),#c62828);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:0 10px 30px #e6394666,inset 0 -4px #0003;border:4px solid #8b0000;animation:bounce 2s ease-in-out infinite}
.logo h1{font-size:42px;color:var(--accent-red);margin:0;text-shadow:3px 3px 0 var(--accent-yellow)}
.logo-tagline{font-size:14px;text-transform:uppercase;letter-spacing:4px;color:var(--text-muted);margin-top:5px;font-weight:700}
.game-mode{margin-bottom:25px}
.game-mode h2{font-size:26px;color:var(--accent-blue);margin:0;text-shadow:2px 2px 0 var(--bg-secondary)}
.subtitle{color:var(--text-secondary);margin-top:5px;font-size:13px;text-transform:uppercase;letter-spacing:2px;font-weight:600}
.player-select{margin:25px 0}
.player-select label{display:block;margin-bottom:15px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;font-size:12px;letter-spacing:2px}
.player-buttons{display:flex;gap:12px;justify-content:center}
.player-btn{width:80px;height:90px;border-radius:16px;border:4px solid var(--border-dark);background:linear-gradient(180deg,#fff,#f0f0f0);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px #6b3000,0 10px 20px #0003}
.player-num{font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--accent-blue)}
.player-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.player-btn:hover{transform:translateY(-5px);box-shadow:0 10px #6b3000,0 15px 30px #00000040}
.player-btn.active{border-color:var(--accent-green);background:linear-gradient(180deg,#e8f5e9,#c8e6c9);box-shadow:0 6px #1b5e20,0 10px 20px #4caf504d}
.player-btn.active .player-num{color:var(--accent-green)}
.start-btn{width:100%;padding:20px 30px;font-size:20px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:3px;background:linear-gradient(180deg,var(--accent-green),#388e3c);color:#fff;border:4px solid #1b5e20;border-radius:16px;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px #1b5e20,0 10px 25px #4caf5066}
.start-btn:hover{transform:translateY(-4px);box-shadow:0 10px #1b5e20,0 15px 35px #4caf5080}
.start-btn:active{transform:translateY(2px);box-shadow:0 2px #1b5e20,0 5px 15px #4caf504d}
.btn-icon{font-size:24px;transition:transform .3s ease}
.start-btn:hover .btn-icon{transform:translate(5px)}
.rules{margin-top:25px;text-align:left;background:var(--bg-secondary);padding:20px;border-radius:16px;border:3px solid var(--border-dark);box-shadow:0 4px #6b3000}
.rules h3{margin:0 0 15px;color:var(--accent-red);font-size:14px;text-align:center}
.rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rule-item{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border-radius:10px;font-size:12px;color:var(--text-secondary);font-weight:600;border:2px solid #ddd}
.rule-icon{font-size:20px}
.footballer-card{-webkit-user-select:none;user-select:none;perspective:1000px;transform-style:preserve-3d}
.footballer-card.clickable{cursor:pointer}
.footballer-card.clickable:hover .card-frame{transform:translateY(-8px) rotateX(10deg) rotateY(-5deg);box-shadow:0 25px 50px #00000059,0 0 0 4px var(--accent-yellow)}
.footballer-card.clickable:hover .card-shine{opacity:1;transform:translate(100%)}
.card-inner{display:flex;flex-direction:column;align-items:center;transform-style:preserve-3d}
.card-frame{position:relative;background:linear-gradient(180deg,#e53935,#c62828,#b71c1c);padding:6px;border-radius:12px;box-shadow:0 8px 25px #0000004d,inset 0 2px #ffffff4d,inset 0 -2px #0003;transition:all .4s cubic-bezier(.34,1.56,.64,1);overflow:hidden;transform-style:preserve-3d;border:3px solid #8b0000}
.card-frame:after{content:"";position:absolute;bottom:-8px;left:4px;right:4px;height:8px;background:linear-gradient(180deg,#8b0000,#5c0000);border-radius:0 0 8px 8px;z-index:-1}
.card-frame:before{content:"";position:absolute;inset:3px;border-radius:9px;padding:2px;background:linear-gradient(135deg,rgba(255,255,255,.4) 0%,transparent 50%,rgba(0,0,0,.2) 100%);pointer-events:none}
.card-shine{position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);opacity:0;transition:transform .6s ease,opacity .3s ease;pointer-events:none;z-index:10}
.card-image-container{position:relative;background:linear-gradient(180deg,#fff,#f0f0f0);border-radius:6px;overflow:hidden;border:2px solid #ddd}
.card-image-container:after{content:"";position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.2) 40%,transparent 100%);pointer-events:none;z-index:2;border-radius:4px 4px 0 0}
.card-image{position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8f9fa,#e9ecef)}
.card-image img{display:block;width:100%;height:100%;object-fit:cover;transition:all .3s ease}
.card-position{position:absolute;bottom:4px;right:4px;background:var(--accent-blue);color:#fff;font-family:var(--font-display);font-weight:700;font-size:9px;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px;box-shadow:0 2px 5px #0003}
.card-flag{position:absolute;bottom:4px;left:4px;background:#fff;padding:2px;border-radius:3px;box-shadow:0 2px 5px #0003;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.1)}
.card-flag svg{display:block}
.footballer-card.small .card-image-container{width:70px;height:85px}
.footballer-card.small .card-image{width:70px;height:70px}
.footballer-card.medium .card-image-container{width:100px;height:120px}
.footballer-card.medium .card-image{width:100px;height:100px}
.footballer-card.large .card-image-container{width:150px;height:180px}
.footballer-card.large .card-image{width:150px;height:150px}
.footballer-card.large .card-frame{padding:8px;border-radius:16px}
.footballer-card.large .card-position{font-size:11px;padding:4px 10px}
.footballer-card.eliminated{pointer-events:none}
.footballer-card.eliminated .card-frame{transform:perspective(500px) rotateX(85deg) translateY(15px);transform-origin:bottom center;opacity:.5;background:linear-gradient(180deg,#666,#444);border-color:#333}
.footballer-card.eliminated .card-frame:after{display:none}
.footballer-card.eliminated .card-image img{filter:grayscale(100%) brightness(.6)}
.eliminated-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#00000080;z-index:5}
.eliminated-x{display:flex;align-items:center;justify-content:center}
.eliminated-x svg{filter:drop-shadow(2px 2px 0 white) drop-shadow(-2px -2px 0 white)}
.footballer-card.selected .card-frame{background:linear-gradient(180deg,#1976d2,#1565c0,#0d47a1);border-color:#0d47a1;transform:translateY(-10px) scale(1.05);box-shadow:0 20px 40px #2196f366,0 0 0 4px var(--accent-yellow),0 0 30px #2196f380;animation:selected-pulse 1s ease infinite}
.footballer-card.selected .card-frame:after{background:linear-gradient(180deg,#0d47a1,#0a3d91)}
@keyframes selected-pulse{0%,to{box-shadow:0 20px 40px #2196f366,0 0 0 4px var(--accent-yellow)}50%{box-shadow:0 20px 40px #2196f399,0 0 0 6px var(--accent-yellow)}}
.footballer-card.secret .card-frame{background:linear-gradient(180deg,#43a047,#388e3c,#2e7d32);border-color:#1b5e20;box-shadow:0 8px 25px #4caf5066,inset 0 2px #ffffff4d,inset 0 -2px #0003}
.footballer-card.secret .card-frame:after{background:linear-gradient(180deg,#1b5e20,#0d3d14)}
.secret-badge{margin-top:12px;background:linear-gradient(135deg,var(--accent-green),#2e7d32);color:#fff;padding:8px 18px;border-radius:25px;font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;box-shadow:0 4px 15px #4caf5066,inset 0 -2px #0003;border:2px solid #1b5e20}
.card-name{margin-top:10px;font-family:var(--font-display);font-size:11px;font-weight:700;color:var(--text-primary);text-align:center;max-width:85px;line-height:1.2;text-transform:uppercase;letter-spacing:.5px;background:#fff;padding:4px 8px;border-radius:8px;box-shadow:0 2px 5px #0000001a}
.footballer-card.medium .card-name{font-size:13px;max-width:110px;padding:5px 10px}
.footballer-card.large .card-name{font-size:16px;max-width:160px;margin-top:14px;padding:6px 12px}
.footballer-card{animation:card-pop .4s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes card-pop{0%{opacity:0;transform:scale(.5) rotateY(-30deg)}to{opacity:1;transform:scale(1) rotateY(0)}}
.footballer-card:nth-child(1){animation-delay:.02s}
.footballer-card:nth-child(2){animation-delay:.04s}
.footballer-card:nth-child(3){animation-delay:.06s}
.footballer-card:nth-child(4){animation-delay:.08s}
.footballer-card:nth-child(5){animation-delay:.1s}
.footballer-card:nth-child(6){animation-delay:.12s}
.footballer-card:nth-child(7){animation-delay:.14s}
.footballer-card:nth-child(8){animation-delay:.16s}
.footballer-card:nth-child(9){animation-delay:.18s}
.footballer-card:nth-child(10){animation-delay:.2s}
.footballer-card:nth-child(11){animation-delay:.22s}
.footballer-card:nth-child(12){animation-delay:.24s}
.secret-assignment{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.assignment-card{background:#fff;border:5px solid var(--border-dark);border-radius:30px;padding:40px;max-width:450px;width:100%;text-align:center;animation:scale-in .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px 40px #00000040,inset 0 -5px #0000001a}
.assignment-card h2{font-size:32px;color:var(--accent-blue);margin:0 0 10px;text-shadow:2px 2px 0 var(--bg-secondary)}
.instruction{color:var(--text-secondary);margin-bottom:25px;font-size:15px;font-weight:600}
.secret-card-container{margin:25px 0;perspective:1000px}
.hidden-card{width:180px;height:220px;margin:0 auto;background:linear-gradient(145deg,#e53935,#c62828,#b71c1c);border:5px solid #8b0000;border-radius:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px #5c0000,0 15px 40px #8b000066;position:relative;overflow:hidden}
.hidden-card:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 15px,rgba(255,255,255,.1) 15px,rgba(255,255,255,.1) 30px)}
.hidden-card:hover{transform:scale(1.08) rotateY(5deg);box-shadow:0 15px #5c0000,0 20px 50px #8b000080}
.hidden-card-inner{color:#fff;text-align:center;position:relative;z-index:1}
.hidden-card-inner span{font-size:80px;font-weight:700;display:block;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3),0 0 30px rgba(255,255,255,.5);animation:wiggle 2s ease-in-out infinite}
.hidden-card-inner p{margin-top:10px;font-size:13px;color:#ffffffe6;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.revealed-card{display:flex;flex-direction:column;align-items:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.footballer-details{margin-top:20px;background:var(--bg-secondary);border:3px solid var(--border-dark);border-radius:16px;padding:15px 20px;width:100%;box-shadow:0 4px #6b3000}
.detail{display:flex;justify-content:space-between;padding:10px 0;border-bottom:2px dashed #ddd}
.detail:last-child{border-bottom:none}
.detail .label{color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.detail .value{color:var(--text-primary);font-weight:700;font-size:14px}
.confirm-btn{width:100%;padding:20px;font-size:18px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:2px;background:linear-gradient(180deg,var(--accent-green),#388e3c);color:#fff;border:4px solid #1b5e20;border-radius:16px;cursor:pointer;margin-top:20px;transition:all .3s ease;box-shadow:0 6px #1b5e20,0 10px 25px #4caf5066}
.confirm-btn:hover{transform:translateY(-4px);box-shadow:0 10px #1b5e20,0 15px 35px #4caf5080}
.confirm-btn:active{transform:translateY(2px);box-shadow:0 2px #1b5e20,0 5px 15px #4caf504d}
.game-board{min-height:100vh;padding:15px;display:flex;flex-direction:column}
.game-header{background:#fff;border:4px solid var(--border-dark);border-radius:20px;padding:15px 20px;margin-bottom:15px;animation:slide-up .3s ease;box-shadow:0 6px #6b3000,0 10px 25px #0003}
.player-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.player-badge{background:linear-gradient(180deg,var(--accent-blue),#1565c0);color:#fff;padding:10px 20px;border-radius:25px;font-family:var(--font-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1px;box-shadow:0 4px #0d47a1,0 6px 15px #2196f34d;border:3px solid #0d47a1}
.remaining-count{background:var(--bg-secondary);border:3px solid var(--border-dark);padding:10px 20px;border-radius:25px;font-weight:700;color:var(--accent-red);font-family:var(--font-display);font-size:14px;box-shadow:0 3px #6b3000}
.header-hint{color:var(--text-muted);font-size:13px;text-align:center;font-weight:600}
.footballer-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:15px;padding:20px;background:linear-gradient(180deg,#2d5a3d,#1e4029);border:5px solid var(--border-dark);border-radius:20px;overflow-y:auto;max-height:calc(100vh - 280px);align-content:start;box-shadow:inset 0 0 50px #0000004d,0 8px #3d2814,0 12px 30px #0000004d}
.game-controls{display:flex;gap:12px;margin-top:15px}
.guess-btn,.end-turn-btn{flex:1;padding:18px;font-size:15px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;border-radius:14px;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:10px}
.guess-btn{background:linear-gradient(180deg,var(--accent-yellow),#ffa000);color:#333;border:4px solid #e65100;box-shadow:0 5px #bf360c,0 8px 20px #ffc10766}
.guess-btn:hover{transform:translateY(-4px);box-shadow:0 9px #bf360c,0 12px 30px #ffc10780}
.guess-btn:active{transform:translateY(2px);box-shadow:0 2px #bf360c,0 4px 10px #ffc1074d}
.end-turn-btn{background:linear-gradient(180deg,var(--accent-blue),#1565c0);color:#fff;border:4px solid #0d47a1;box-shadow:0 5px #0d47a1,0 8px 20px #2196f366}
.end-turn-btn:hover{transform:translateY(-4px);box-shadow:0 9px #0d47a1,0 12px 30px #2196f380}
.end-turn-btn:active{transform:translateY(2px);box-shadow:0 2px #0d47a1,0 4px 10px #2196f34d}
.question-suggestions{margin-top:15px;text-align:center;background:#fff;border:3px solid var(--border-dark);border-radius:16px;padding:15px;box-shadow:0 4px #6b3000}
.question-suggestions p{color:var(--text-muted);font-size:11px;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.suggestion-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.squad-builder{min-height:100vh;background:linear-gradient(135deg,#0a0f1a,#1a1f2e,#0d1220);display:flex;flex-direction:column}
.sb-header{display:flex;align-items:center;justify-content:space-between;padding:1rem;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 100%)}
.sb-back-btn{display:flex;align-items:center;gap:.5rem;background:#ffffff1a;border:none;color:#fff;padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;transition:background .2s}
.sb-back-btn:hover{background:#fff3}
.sb-title{text-align:center}
.sb-title h1{font-family:var(--font-display);font-size:1.5rem;color:#f0d048;margin:0;text-shadow:0 2px 10px rgba(240,208,72,.3)}
.sb-subtitle{font-size:.75rem;color:#fff9;text-transform:uppercase;letter-spacing:.1em}
.sb-stats{display:flex;gap:1rem}
.sb-stat{display:flex;flex-direction:column;align-items:center;background:linear-gradient(135deg,#c9a227,#a88b1f);padding:.5rem 1rem;border-radius:8px;min-width:60px}
.sb-stat-value{font-family:var(--font-display);font-size:1.25rem;font-weight:700;color:#1a1a2e}
.sb-stat-label{font-size:.6rem;color:#1a1a2e;text-transform:uppercase;font-weight:600}
.sb-pitch-container{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem}
.sb-pitch{position:relative;width:100%;max-width:500px;aspect-ratio:3/4;background:linear-gradient(180deg,#1a5c2e,#228b3b,#1a5c2e,#228b3b,#1a5c2e,#228b3b,#1a5c2e,#228b3b,#1a5c2e,#228b3b,#1a5c2e,#228b3b 88%,#1a5c2e);border-radius:12px;box-shadow:0 0 60px #228b3b4d,inset 0 0 100px #0003;overflow:hidden}
.sb-pitch-markings{position:absolute;inset:0;pointer-events:none}
.sb-center-circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border:2px solid rgba(255,255,255,.25);border-radius:50%}
.sb-center-circle:before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;background:#ffffff4d;border-radius:50%}
.sb-center-line{position:absolute;top:50%;left:0;right:0;height:2px;background:#ffffff40}
.sb-penalty-box{position:absolute;left:50%;transform:translate(-50%);width:55%;height:16%;border:2px solid rgba(255,255,255,.25)}
.sb-penalty-box.top{top:0;border-top:none}
.sb-penalty-box.bottom{bottom:0;border-bottom:none}
.sb-goal-box{position:absolute;left:50%;transform:translate(-50%);width:25%;height:6%;border:2px solid rgba(255,255,255,.25)}
.sb-goal-box.top{top:0;border-top:none}
.sb-goal-box.bottom{bottom:0;border-bottom:none}
.sb-player-slot{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:transform .2s,z-index 0s;z-index:1}
.sb-player-slot:hover{transform:translate(-50%,-50%) scale(1.1);z-index:10}
.sb-player-slot.selected{transform:translate(-50%,-50%) scale(1.15);z-index:10}
.sb-fut-card{width:60px;height:85px;background:linear-gradient(165deg,#c9a227,#f0d048,#e8c84a 30%,#c9a227,#a88b1f 70%,#c9a227);border-radius:6px;position:relative;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 15px #00000080,inset 0 1px #fff6,inset 0 -1px #0003;border:1px solid #a88b1f;overflow:hidden}
.sb-fut-card:before{content:"";position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,transparent 100%);pointer-events:none}
.sb-card-top{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:3px 5px 0;position:relative;z-index:1}
.sb-card-rating{font-family:var(--font-display);font-size:14px;font-weight:700;color:#1a1a2e;line-height:1}
.sb-card-pos{font-size:7px;font-weight:700;color:#1a1a2e;text-transform:uppercase;line-height:1}
.sb-card-face{width:40px;height:40px;border-radius:3px;overflow:hidden;background:linear-gradient(180deg,#e8d5a3,#c9a227);position:relative;z-index:1}
.sb-card-face img{width:100%;height:100%;object-fit:cover;object-position:top center}
.sb-card-bottom{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0;position:relative;z-index:1}
.sb-card-flag{width:16px;height:11px;border-radius:2px}
.sb-card-name{font-size:6px;font-weight:700;color:#1a1a2e;text-transform:uppercase;max-width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-empty-card{width:60px;height:85px;background:#c9a22733;border:2px dashed rgba(201,162,39,.5);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem}
.sb-empty-pos{font-size:10px;font-weight:700;color:#c9a227cc}
.sb-empty-plus{font-size:24px;color:#c9a22799}
.sb-formation-label{position:absolute;bottom:15px;left:50%;transform:translate(-50%);font-family:var(--font-display);font-size:24px;color:#fff6;text-shadow:0 2px 10px rgba(0,0,0,.5);cursor:pointer;transition:color .2s}
.sb-formation-label:hover{color:#ffffffb3}
.flag-br{background:linear-gradient(180deg,#009c3b 0% 33%,#ffdf00 33% 66%,#009c3b 66%)}
.flag-no{background:#ef2b2d;position:relative}
.flag-no:after{content:"";position:absolute;top:0;bottom:0;left:25%;width:20%;background:#002868}
.flag-eg{background:linear-gradient(180deg,#ce1126 0% 33%,#fff 33% 66%,#000 66%)}
.flag-be{background:linear-gradient(90deg,#000 0% 33%,#ffd90c 33% 66%,#f31830 66%)}
.flag-en{background:#fff;position:relative}
.flag-en:before{content:"";position:absolute;top:35%;left:0;right:0;height:30%;background:#cf142b}
.flag-en:after{content:"";position:absolute;top:0;bottom:0;left:35%;width:30%;background:#cf142b}
.flag-pt{background:linear-gradient(90deg,#060 0% 40%,red 40%)}
.flag-nl{background:linear-gradient(180deg,#ae1c28 0% 33%,#fff 33% 66%,#21468b 66%)}
.flag-es{background:linear-gradient(180deg,#c60b1e 0% 25%,#ffc400 25% 75%,#c60b1e 75%)}
.flag-fr{background:linear-gradient(90deg,#002654 0% 33%,#fff 33% 66%,#ce1126 66%)}
.flag-de{background:linear-gradient(180deg,#000 0% 33%,#d00 33% 66%,#fc0 66%)}
.flag-ar{background:linear-gradient(180deg,#74acdf 0% 33%,#fff 33% 66%,#74acdf 66%)}
.flag-pl{background:linear-gradient(180deg,#fff 0% 50%,#dc143c 50%)}
.flag-ng{background:linear-gradient(90deg,#008751 0% 33%,#fff 33% 66%,#008751 66%)}
.flag-default{background:#ccc}
.sb-modal-overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.sb-modal{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:16px;max-width:500px;width:100%;max-height:80vh;overflow:hidden;border:2px solid #c9a227}
.sb-modal-header{display:flex;align-items:center;justify-content:space-between;padding:1rem;background:linear-gradient(90deg,#c9a227,#f0d048)}
.sb-modal-header h2{font-family:var(--font-display);font-size:1.25rem;color:#1a1a2e;margin:0}
.sb-modal-close{background:none;border:none;font-size:1.5rem;color:#1a1a2e;cursor:pointer;line-height:1}
.sb-player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:.75rem;padding:1rem;max-height:60vh;overflow-y:auto}
.sb-player-option{display:flex;flex-direction:column;align-items:center;gap:.25rem;cursor:pointer;transition:transform .2s}
.sb-player-option:hover{transform:scale(1.05)}
.sb-player-option.in-squad{opacity:.5}
.sb-option-card{width:55px;height:70px;background:linear-gradient(165deg,#c9a227,#f0d048,#c9a227 60%,#a88b1f);border-radius:4px;display:flex;flex-direction:column;align-items:center;padding:3px;position:relative}
.sb-option-rating{font-family:var(--font-display);font-size:10px;font-weight:700;color:#1a1a2e;position:absolute;top:3px;left:5px}
.sb-option-face{width:38px;height:38px;border-radius:2px;overflow:hidden;margin-top:12px}
.sb-option-face img{width:100%;height:100%;object-fit:cover;object-position:top center}
.sb-option-flag{width:14px;height:10px;border-radius:1px;margin-top:2px}
.sb-option-name{font-size:8px;color:#fffc;text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-controls{display:flex;gap:1rem;padding:1rem;justify-content:center;background:linear-gradient(0deg,rgba(0,0,0,.5) 0%,transparent 100%)}
.sb-btn{padding:.75rem 1.5rem;border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .2s;border:2px solid #c9a227;background:transparent;color:#f0d048}
.sb-btn:hover{background:#c9a22733}
.sb-btn.primary{background:linear-gradient(135deg,#c9a227,#f0d048);color:#1a1a2e;border:none}
.sb-btn.primary:hover{transform:scale(1.02);box-shadow:0 4px 15px #c9a22766}
@media(max-width:480px){.sb-header{flex-wrap:wrap;gap:.5rem}.sb-title h1{font-size:1.2rem}.sb-stats{gap:.5rem}.sb-stat{padding:.35rem .75rem;min-width:50px}.sb-stat-value{font-size:1rem}.sb-fut-card{width:48px;height:68px}.sb-card-rating{font-size:11px}.sb-card-pos{font-size:6px}.sb-card-face{width:32px;height:32px}.sb-card-flag{width:12px;height:8px}.sb-card-name{font-size:5px}.sb-empty-card{width:48px;height:68px}.sb-formation-label{font-size:18px}.sb-controls{flex-direction:column}.sb-btn{width:100%}}
.app{min-height:100vh;width:100%;max-width:600px;margin:0 auto}
@media(min-width:768px){.app{max-width:800px}}</style>
