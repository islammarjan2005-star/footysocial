<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footy Social - Football Party Games</title>
    <style rel="stylesheet" crossorigin>@import"https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&family=Oswald:wght@500;600;700&display=swap";
*{box-sizing:border-box}
:root{--bg-primary: #f5c542;--bg-secondary: #ffe066;--bg-light: #fff8dc;--bg-card: #ffffff;--bg-board: #2d5a3d;--accent-red: #e63946;--accent-blue: #2196f3;--accent-yellow: #ffc107;--accent-green: #4caf50;--accent-orange: #ff6b35;--accent-purple: #9c27b0;--player-red: #d32f2f;--player-blue: #1976d2;--text-primary: #1a1a2e;--text-secondary: #333333;--text-muted: #666666;--text-light: #ffffff;--border-dark: #8b4513;--border-light: #daa520;--shadow-pop: 0 8px 25px rgba(0, 0, 0, .25);--shadow-card: 0 4px 15px rgba(0, 0, 0, .2);--font-display: "Fredoka One", "Oswald", cursive;--font-body: "Nunito", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;font-family:var(--font-body);line-height:1.5;font-weight:400;color-scheme:light;color:var(--text-primary);background:var(--bg-primary);font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{margin:0;padding:0;min-height:100vh;overflow-x:hidden}
body{display:block;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.3) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.2) 0%,transparent 40%),radial-gradient(circle,rgba(255,107,53,.1) 2px,transparent 2px),linear-gradient(180deg,#ffd54f,#f5c542 30%,#ffb300 70%,#f5c542);background-size:100% 100%,100% 100%,30px 30px,100% 100%;background-attachment:fixed}
#root{min-height:100vh}
h1,h2,h3,h4,h5,h6{margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
p{margin:0}
button{font-family:var(--font-body);cursor:pointer;border:none;outline:none}
button:active{transform:scale(.98)}
.panel{background:#fff;border:4px solid var(--border-dark);border-radius:20px;box-shadow:var(--shadow-pop),inset 0 -4px #0000001a;position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,.3) 50%,transparent 100%);pointer-events:none;border-radius:16px 16px 0 0}
.gloss{position:relative;overflow:hidden}
.gloss:before{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.2) 50%,transparent 100%);pointer-events:none;z-index:1}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg-light);border-radius:4px}
::-webkit-scrollbar-thumb{background:var(--accent-orange);border-radius:4px;border:2px solid var(--bg-light)}
::-webkit-scrollbar-thumb:hover{background:var(--accent-red)}
@keyframes float{0%,to{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bounce{0%,to{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.2)}to{transform:scale(1)}}
@keyframes pulse-glow{0%,to{box-shadow:0 0 20px #4caf5080}50%{box-shadow:0 0 40px #4caf50cc}}
@keyframes shimmer{0%{background-position:-200% center}to{background-position:200% center}}
@keyframes confetti-fall{0%{transform:translateY(-100vh) rotate(0);opacity:1}to{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes slide-up{0%{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes scale-in{0%{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes card-flip{0%{transform:perspective(1000px) rotateY(0)}to{transform:perspective(1000px) rotateY(180deg)}}
.perspective-container{perspective:1500px;transform-style:preserve-3d}
.setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.back-to-home{position:absolute;top:20px;left:20px;display:flex;align-items:center;gap:8px;padding:10px 20px;background:#fff;border:3px solid var(--border-dark);border-radius:50px;font-weight:700;font-size:14px;color:var(--text-secondary);cursor:pointer;transition:all .3s ease;box-shadow:0 4px #6b3000,0 6px 15px #00000026;z-index:100}
.back-to-home:hover{transform:translateY(-2px);box-shadow:0 6px #6b3000,0 8px 20px #0003;color:var(--accent-red)}
.back-to-home:active{transform:translateY(1px);box-shadow:0 2px #6b3000,0 4px 10px #0000001a}
.back-arrow{font-size:18px;transition:transform .3s ease}
.back-to-home:hover .back-arrow{transform:translate(-3px)}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;bottom:-20px;width:20px;height:20px;background:var(--accent-orange);border-radius:50%;opacity:.8;animation:float-up 6s ease-in-out infinite}
.particle:before{content:"⚽";font-size:16px}
@keyframes float-up{0%{transform:translateY(0) rotate(0) scale(1);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-100vh) rotate(360deg) scale(.5);opacity:0}}
.setup-card{background:#fff;border:5px solid var(--border-dark);border-radius:30px;padding:40px;max-width:450px;width:100%;text-align:center;animation:scale-in .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 15px 40px #00000040,inset 0 -5px #0000001a;position:relative;overflow:hidden}
.setup-card:before{content:"";position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,.25) 50%,transparent 100%);pointer-events:none;border-radius:25px 25px 0 0;z-index:0}
.logo{margin-bottom:25px}
.logo-icon{width:100px;height:100px;margin:0 auto 15px;background:linear-gradient(135deg,var(--accent-red),#c62828);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:0 10px 30px #e6394666,inset 0 -4px #0003;border:4px solid #8b0000;animation:bounce 2s ease-in-out infinite}
.logo h1{font-size:42px;color:var(--accent-red);margin:0;text-shadow:3px 3px 0 var(--accent-yellow)}
.logo-tagline{font-size:14px;text-transform:uppercase;letter-spacing:4px;color:var(--text-muted);margin-top:5px;font-weight:700}
.game-mode{margin-bottom:25px}
.game-mode h2{font-size:26px;color:var(--accent-blue);margin:0;text-shadow:2px 2px 0 var(--bg-secondary)}
.subtitle{color:var(--text-secondary);margin-top:5px;font-size:13px;text-transform:uppercase;letter-spacing:2px;font-weight:600}
.player-select{margin:25px 0}
.player-select label{display:block;margin-bottom:15px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;font-size:12px;letter-spacing:2px}
.player-buttons{display:flex;gap:12px;justify-content:center}
.player-btn{width:80px;height:90px;border-radius:16px;border:4px solid var(--border-dark);background:linear-gradient(180deg,#fff,#f0f0f0);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px #6b3000,0 10px 20px #0003}
.player-num{font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--accent-blue)}
.player-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.player-btn:hover{transform:translateY(-5px);box-shadow:0 10px #6b3000,0 15px 30px #00000040}
.player-btn.active{border-color:var(--accent-green);background:linear-gradient(180deg,#e8f5e9,#c8e6c9);box-shadow:0 6px #1b5e20,0 10px 20px #4caf504d}
.player-btn.active .player-num{color:var(--accent-green)}
.start-btn{width:100%;padding:20px 30px;font-size:20px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:3px;background:linear-gradient(180deg,var(--accent-green),#388e3c);color:#fff;border:4px solid #1b5e20;border-radius:16px;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px #1b5e20,0 10px 25px #4caf5066}
.start-btn:hover{transform:translateY(-4px);box-shadow:0 10px #1b5e20,0 15px 35px #4caf5080}
.start-btn:active{transform:translateY(2px);box-shadow:0 2px #1b5e20,0 5px 15px #4caf504d}
.btn-icon{font-size:24px;transition:transform .3s ease}
.start-btn:hover .btn-icon{transform:translate(5px)}
.rules{margin-top:25px;text-align:left;background:var(--bg-secondary);padding:20px;border-radius:16px;border:3px solid var(--border-dark);box-shadow:0 4px #6b3000}
.rules h3{margin:0 0 15px;color:var(--accent-red);font-size:14px;text-align:center}
.rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rule-item{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border-radius:10px;font-size:12px;color:var(--text-secondary);font-weight:600;border:2px solid #ddd}
.rule-icon{font-size:20px}
.footballer-card{-webkit-user-select:none;user-select:none;perspective:1000px;transform-style:preserve-3d;position:relative}
.footballer-card.clickable{cursor:pointer}
.footballer-card.clickable:hover .card-frame{transform:translateY(-8px) rotateX(8deg) rotateY(-4deg) scale(1.02);box-shadow:0 25px 50px #0006,0 0 30px #c9a22780}
.footballer-card.clickable:hover .card-shine{opacity:1;transform:translate(100%)}
.footballer-card.clickable:hover .card-glow{opacity:1}
.card-inner{display:flex;flex-direction:column;align-items:center;transform-style:preserve-3d}
.card-frame{position:relative;background:linear-gradient(165deg,#c9a227,#f0d048,#e8c23a,#c9a227,#a88b1f);padding:6px;border-radius:10px;box-shadow:0 8px 25px #00000059,inset 0 2px #fff6,inset 0 -2px #0003,0 0 0 2px #a88b1f;transition:all .4s cubic-bezier(.34,1.56,.64,1);overflow:hidden;transform-style:preserve-3d;border:2px solid #8b7419}
.card-frame:after{content:"";position:absolute;bottom:-6px;left:3px;right:3px;height:6px;background:linear-gradient(180deg,#8b7419,#5c4d10);border-radius:0 0 8px 8px;z-index:-1}
.card-frame:before{content:"";position:absolute;inset:2px;border-radius:8px;background:linear-gradient(135deg,rgba(255,255,255,.5) 0%,transparent 40%,rgba(0,0,0,.1) 100%);pointer-events:none}
.card-glow{position:absolute;inset:-3px;border-radius:12px;background:linear-gradient(45deg,#f0d048,#c9a227,#f0d048);opacity:0;z-index:-1;filter:blur(8px);transition:opacity .3s ease;animation:glow-pulse 2s ease-in-out infinite}
@keyframes glow-pulse{0%,to{opacity:0}50%{opacity:.6}}
.card-shine{position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);opacity:0;transition:transform .6s ease,opacity .3s ease;pointer-events:none;z-index:10}
.card-rating{position:absolute;top:4px;left:4px;display:flex;flex-direction:column;align-items:center;z-index:15;background:#1a1a2ed9;padding:3px 5px;border-radius:4px;box-shadow:0 2px 4px #0000004d}
.rating-number{font-family:var(--font-display);font-size:14px;font-weight:800;color:#f0d048;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.rating-pos{font-family:var(--font-display);font-size:7px;font-weight:700;color:#f0d048cc;text-transform:uppercase;line-height:1;margin-top:1px}
.card-image-container{position:relative;background:linear-gradient(180deg,#e8d5a3,#d4c08a,#c9a227);border-radius:6px;overflow:hidden;border:2px solid rgba(139,116,25,.5)}
.card-image-container:after{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 50%,transparent 100%);pointer-events:none;z-index:2;border-radius:4px 4px 0 0}
.card-image{position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8d5a3,#c9a227)}
.card-image img{display:block;width:100%;height:100%;object-fit:cover;transition:all .3s ease}
.card-flag{position:absolute;bottom:4px;left:4px;background:#1a1a2ed9;padding:2px 3px;border-radius:3px;box-shadow:0 2px 4px #0000004d;display:flex;align-items:center;justify-content:center;z-index:3}
.card-flag svg{display:block}
.footballer-card.small .card-image-container{width:70px;height:85px}
.footballer-card.small .card-image{width:70px;height:70px}
.footballer-card.medium .card-image-container{width:100px;height:120px}
.footballer-card.medium .card-image{width:100px;height:100px}
.footballer-card.large .card-image-container{width:150px;height:180px}
.footballer-card.large .card-image{width:150px;height:150px}
.footballer-card.large .card-frame{padding:8px;border-radius:14px}
.footballer-card.large .card-rating{padding:5px 8px}
.footballer-card.large .rating-number{font-size:20px}
.footballer-card.large .rating-pos{font-size:10px}
.footballer-card.flipping .card-frame{animation:card-flip-out .3s ease forwards}
@keyframes card-flip-out{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(.9)}to{transform:rotateY(0) scale(1)}}
.footballer-card.eliminated{pointer-events:none}
.footballer-card.eliminated .card-frame{transform:perspective(500px) rotateX(75deg) translateY(10px);transform-origin:bottom center;opacity:.4;background:linear-gradient(180deg,#4a4a4a,#2d2d2d);border-color:#1a1a1a;box-shadow:0 4px 10px #0000004d,inset 0 0 20px #0006;transition:all .5s cubic-bezier(.4,0,.2,1)}
.footballer-card.eliminated .card-frame:after{display:none}
.footballer-card.eliminated .card-image img{filter:grayscale(100%) brightness(.5)}
.footballer-card.eliminated .card-rating{opacity:.5}
.eliminated-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;z-index:5}
.eliminated-x{display:flex;align-items:center;justify-content:center;animation:x-pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes x-pop{0%{transform:scale(0) rotate(-45deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.eliminated-x svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.particle-container{position:absolute;top:50%;left:50%;width:0;height:0;z-index:100;pointer-events:none}
.particle{position:absolute;width:8px;height:8px;background:linear-gradient(135deg,#f0d048,#ffeb3b);border-radius:50%;box-shadow:0 0 6px #f0d048}
.particle:nth-child(1){animation:particle-fly-1 .6s ease-out forwards}
.particle:nth-child(2){animation:particle-fly-2 .6s ease-out forwards}
.particle:nth-child(3){animation:particle-fly-3 .6s ease-out forwards}
.particle:nth-child(4){animation:particle-fly-4 .6s ease-out forwards}
.particle:nth-child(5){animation:particle-fly-5 .6s ease-out forwards}
.particle:nth-child(6){animation:particle-fly-6 .6s ease-out forwards}
.particle:nth-child(7){animation:particle-fly-7 .6s ease-out forwards}
.particle:nth-child(8){animation:particle-fly-8 .6s ease-out forwards}
@keyframes particle-fly-1{0%{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) translateY(-50px) scale(0);opacity:0}}
@keyframes particle-fly-2{0%{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) translate(35px,-35px) scale(0);opacity:0}}
@keyframes particle-fly-3{0%{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) translate(50px) scale(0);opacity:0}}
@keyframes particle-fly-4{0%{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) translate(35px,35px) scale(0);opacity:0}}
@keyframes particle-fly-5{0%{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) translateY(50px) scale(0);opacity:0}}
@keyframes particle-fly-6{0%{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) translate(-35px,35px) scale(0);opacity:0}}
@keyframes particle-fly-7{0%{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) translate(-50px) scale(0);opacity:0}}
@keyframes particle-fly-8{0%{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) translate(-35px,-35px) scale(0);opacity:0}}
.footballer-card.selected .card-frame{background:linear-gradient(165deg,gold,#fff176,#ffeb3b,gold,#ffc107);border-color:#ff9800;transform:translateY(-12px) scale(1.08);box-shadow:0 25px 50px #ffc10780,0 0 40px #ffeb3b99,0 0 0 4px #ff9800;animation:selected-glow 1.2s ease infinite}
.footballer-card.selected .card-frame:after{background:linear-gradient(180deg,#e65100,#bf360c)}
.footballer-card.selected .card-glow{opacity:1;background:linear-gradient(45deg,#ffeb3b,#ffc107,#ffeb3b)}
@keyframes selected-glow{0%,to{box-shadow:0 25px 50px #ffc10780,0 0 40px #ffeb3b99,0 0 0 4px #ff9800}50%{box-shadow:0 25px 50px #ffc107b3,0 0 60px #ffeb3bcc,0 0 0 6px #ff9800}}
.footballer-card.secret .card-frame{background:linear-gradient(165deg,#2e7d32,#4caf50,#43a047,#2e7d32,#1b5e20);border-color:#1b5e20;box-shadow:0 8px 25px #4caf5066,inset 0 2px #ffffff4d,inset 0 -2px #0003,0 0 20px #4caf504d}
.footballer-card.secret .card-frame:after{background:linear-gradient(180deg,#1b5e20,#0d3d14)}
.footballer-card.secret .card-rating{background:#1b5e20e6}
.footballer-card.secret .rating-number{color:#81c784}
.footballer-card.secret .rating-pos{color:#81c784cc}
.secret-badge{margin-top:12px;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;padding:8px 18px;border-radius:25px;font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;box-shadow:0 4px 15px #4caf5066,inset 0 -2px #0003;border:2px solid #1b5e20;animation:badge-pulse 2s ease infinite}
@keyframes badge-pulse{0%,to{box-shadow:0 4px 15px #4caf5066,inset 0 -2px #0003}50%{box-shadow:0 4px 25px #4caf50b3,inset 0 -2px #0003}}
.card-name{margin-top:10px;font-family:var(--font-display);font-size:10px;font-weight:700;color:#1a1a2e;text-align:center;max-width:85px;line-height:1.2;text-transform:uppercase;letter-spacing:.5px;background:linear-gradient(135deg,#f0d048,#c9a227);padding:5px 8px;border-radius:6px;box-shadow:0 3px 8px #0003;border:1px solid #a88b1f}
.footballer-card.medium .card-name{font-size:12px;max-width:110px;padding:6px 10px}
.footballer-card.large .card-name{font-size:14px;max-width:160px;margin-top:14px;padding:8px 14px}
.footballer-card{animation:card-deal .5s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes card-deal{0%{opacity:0;transform:translateY(-30px) rotateX(-20deg) scale(.8)}to{opacity:1;transform:translateY(0) rotateX(0) scale(1)}}
.footballer-card:nth-child(1){animation-delay:.02s}
.footballer-card:nth-child(2){animation-delay:.04s}
.footballer-card:nth-child(3){animation-delay:.06s}
.footballer-card:nth-child(4){animation-delay:.08s}
.footballer-card:nth-child(5){animation-delay:.1s}
.footballer-card:nth-child(6){animation-delay:.12s}
.footballer-card:nth-child(7){animation-delay:.14s}
.footballer-card:nth-child(8){animation-delay:.16s}
.footballer-card:nth-child(9){animation-delay:.18s}
.footballer-card:nth-child(10){animation-delay:.2s}
.footballer-card:nth-child(11){animation-delay:.22s}
.footballer-card:nth-child(12){animation-delay:.24s}
.footballer-card:nth-child(13){animation-delay:.26s}
.footballer-card:nth-child(14){animation-delay:.28s}
.footballer-card:nth-child(15){animation-delay:.3s}
.footballer-card:nth-child(16){animation-delay:.32s}
.footballer-card:nth-child(17){animation-delay:.34s}
.footballer-card:nth-child(18){animation-delay:.36s}
.footballer-card:nth-child(19){animation-delay:.38s}
.footballer-card:nth-child(20){animation-delay:.4s}
.footballer-card:nth-child(21){animation-delay:.42s}
.footballer-card:nth-child(22){animation-delay:.44s}
.footballer-card:nth-child(23){animation-delay:.46s}
.footballer-card:nth-child(24){animation-delay:.48s}
.footballer-card.clickable:active .card-frame{transform:scale(.95);transition:transform .1s ease}
.secret-assignment{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1a1a2e,#16213e)}
.secret-assignment.selection-mode{flex-direction:column;align-items:stretch;padding:20px;gap:20px}
.selection-header{text-align:center;padding:20px;background:linear-gradient(180deg,#ffd70026,#ffd7000d);border-radius:20px;border:2px solid rgba(255,215,0,.3)}
.selection-header h2{font-size:28px;color:gold;margin:0 0 10px;text-shadow:0 2px 10px rgba(255,215,0,.5)}
.selection-header .instruction{color:#fffc;font-size:14px;margin:0}
.footballer-selection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;padding:10px;max-width:100%;overflow-y:auto;max-height:calc(100vh - 200px)}
@media(min-width:600px){.footballer-selection-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}}
.selection-card{position:relative;cursor:pointer;border-radius:12px;overflow:hidden;transition:all .3s ease;border:3px solid transparent}
.selection-card:hover:not(.taken){transform:scale(1.05);border-color:gold;box-shadow:0 0 20px #ffd70080}
.selection-card.selected{border-color:#4caf50;box-shadow:0 0 25px #4caf5099}
.selection-card.taken{cursor:not-allowed;opacity:.5}
.taken-overlay{position:absolute;inset:0;background:#000000b3;display:flex;align-items:center;justify-content:center;font-weight:700;color:#f44;font-size:14px;letter-spacing:2px}
.assignment-card{background:linear-gradient(180deg,#1e1e3f,#151530);border:4px solid #ffd700;border-radius:30px;padding:40px;max-width:450px;width:100%;text-align:center;animation:scale-in .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px 40px #00000080,0 0 30px #ffd70033}
.assignment-card h2{font-size:32px;color:gold;margin:0 0 10px;text-shadow:0 2px 10px rgba(255,215,0,.5)}
.instruction{color:#fffc;margin-bottom:25px;font-size:15px;font-weight:600}
.secret-card-container{margin:25px 0;perspective:1000px}
.selected-footballer{display:flex;flex-direction:column;align-items:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.footballer-details{margin-top:20px;background:#ffd7001a;border:2px solid rgba(255,215,0,.3);border-radius:16px;padding:15px 20px;width:100%}
.detail{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,215,0,.2)}
.detail:last-child{border-bottom:none}
.detail .label{color:#fff9;font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.detail .value{color:#fff;font-weight:700;font-size:14px}
.confirm-buttons{display:flex;gap:12px;margin-top:24px}
.cancel-btn{flex:1;padding:16px;font-size:14px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;background:linear-gradient(180deg,#444,#333);color:#fff;border:3px solid #222;border-radius:12px;cursor:pointer;transition:all .3s ease;box-shadow:0 4px #111}
.cancel-btn:hover{transform:translateY(-2px);box-shadow:0 6px #111}
.confirm-btn{flex:1;padding:16px;font-size:14px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;background:linear-gradient(180deg,#4caf50,#388e3c);color:#fff;border:3px solid #1b5e20;border-radius:12px;cursor:pointer;transition:all .3s ease;box-shadow:0 4px #1b5e20}
.confirm-btn:hover{transform:translateY(-2px);box-shadow:0 6px #1b5e20}
.confirm-btn:active,.cancel-btn:active{transform:translateY(2px);box-shadow:0 1px #1b5e20}
@keyframes scale-in{0%{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}to{transform:scale(1);opacity:1}}
@keyframes wiggle{0%,to{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.game-board{min-height:100vh;padding:15px;display:flex;flex-direction:column;transition:background .5s ease}
.game-board.tension-low{background:linear-gradient(180deg,#ffd54f,#ffb300)}
.game-board.tension-medium{background:linear-gradient(180deg,#ffb74d,#ff9800)}
.game-board.tension-high{background:linear-gradient(180deg,#ff8a65,#f4511e)}
.game-board.tension-critical{background:linear-gradient(180deg,#ef5350,#c62828);animation:tension-pulse 1s ease infinite}
@keyframes tension-pulse{0%,to{filter:brightness(1)}50%{filter:brightness(1.1)}}
.game-header{background:linear-gradient(135deg,#1a1a2e,#16213e);border:3px solid #c9a227;border-radius:16px;padding:15px 20px;margin-bottom:15px;animation:slide-up .3s ease;box-shadow:0 6px #8b7419,0 10px 25px #0000004d,inset 0 1px #ffffff1a}
.player-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.player-badge{background:linear-gradient(135deg,#c9a227,#f0d048);color:#1a1a2e;padding:10px 20px;border-radius:25px;font-family:var(--font-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1px;box-shadow:0 4px #8b7419,0 6px 15px #c9a22766;border:2px solid #a88b1f}
.remaining-display{display:flex;flex-direction:column;align-items:center;background:#ffffff1a;border:2px solid rgba(201,162,39,.5);padding:8px 16px;border-radius:12px}
.remaining-count{font-family:var(--font-display);font-size:24px;font-weight:800;color:#f0d048;line-height:1;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.remaining-label{font-size:10px;color:#f0d048b3;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.progress-container{margin-bottom:12px}
.progress-bar{position:relative;height:8px;background:#ffffff26;border-radius:4px;overflow:hidden;box-shadow:inset 0 2px 4px #0003}
.progress-fill{height:100%;background:linear-gradient(90deg,#4caf50,#8bc34a,#cddc39,#ffeb3b,#ff9800,#f44336);background-size:200% 100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px #4caf5080}
.progress-glow{position:absolute;top:-2px;width:4px;height:12px;background:#fff;border-radius:2px;box-shadow:0 0 10px #fff,0 0 20px #f0d048;transition:left .5s cubic-bezier(.4,0,.2,1);transform:translate(-50%)}
.progress-markers{display:flex;justify-content:space-around;margin-top:6px;padding:0 10%}
.progress-markers span{font-size:9px;color:#fff6;font-weight:600;transition:all .3s ease}
.progress-markers span.reached{color:#f0d048;text-shadow:0 0 8px rgba(240,208,72,.5)}
.header-hint{display:flex;align-items:center;justify-content:center;gap:8px;color:#fff9;font-size:12px;font-weight:600}
.header-hint svg{animation:point-left 1s ease infinite}
@keyframes point-left{0%,to{transform:translate(0)}50%{transform:translate(-4px)}}
.footballer-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:15px;padding:20px;background:linear-gradient(180deg,#1e4d2b,#163d22,#0d2915);border:4px solid #c9a227;border-radius:16px;overflow-y:auto;max-height:calc(100vh - 320px);align-content:start;box-shadow:inset 0 0 60px #0006,0 6px #8b7419,0 10px 30px #0000004d;position:relative}
.footballer-grid:before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100px;height:100px;border:3px solid rgba(255,255,255,.08);border-radius:50%;pointer-events:none}
.footballer-grid:after{content:"";position:absolute;top:50%;left:0;right:0;height:3px;background:#ffffff0f;pointer-events:none}
.game-controls{display:flex;gap:12px;margin-top:15px}
.guess-btn,.end-turn-btn{flex:1;padding:18px;font-size:15px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;border-radius:14px;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.btn-icon{font-size:20px}
.btn-arrow{font-size:18px;transition:transform .3s ease}
.end-turn-btn:hover .btn-arrow{transform:translate(4px)}
.ripple{position:absolute;border-radius:50%;background:#fff6;transform:translate(-50%,-50%) scale(0);animation:ripple-effect .6s ease-out forwards;pointer-events:none;width:20px;height:20px}
@keyframes ripple-effect{to{transform:translate(-50%,-50%) scale(20);opacity:0}}
.guess-btn{background:linear-gradient(135deg,#c9a227,#f0d048);color:#1a1a2e;border:3px solid #a88b1f;box-shadow:0 5px #8b7419,0 8px 20px #c9a22766}
.guess-btn:hover{transform:translateY(-4px);box-shadow:0 9px #8b7419,0 12px 30px #c9a22780}
.guess-btn:active{transform:translateY(2px);box-shadow:0 2px #8b7419,0 4px 10px #c9a2274d}
.end-turn-btn{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#f0d048;border:3px solid #c9a227;box-shadow:0 5px #8b7419,0 8px 20px #0000004d}
.end-turn-btn:hover{transform:translateY(-4px);box-shadow:0 9px #8b7419,0 12px 30px #0006}
.end-turn-btn:active{transform:translateY(2px);box-shadow:0 2px #8b7419,0 4px 10px #0003}
.question-suggestions{margin-top:15px;text-align:center;background:linear-gradient(135deg,#1a1a2e,#16213e);border:2px solid rgba(201,162,39,.5);border-radius:12px;padding:12px;box-shadow:0 4px #8b741980}
.question-suggestions p{color:#f0d048b3;font-size:10px;margin-bottom:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.suggestion-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.suggestion-tags span{background:#c9a22726;border:1px solid rgba(201,162,39,.4);padding:8px 14px;border-radius:20px;font-size:11px;color:#f0d048e6;cursor:pointer;transition:all .2s ease;font-weight:600}
.suggestion-tags span:hover{background:linear-gradient(135deg,#c9a227,#f0d048);border-color:#a88b1f;color:#1a1a2e;transform:translateY(-2px);box-shadow:0 4px 10px #c9a22766}
@media(min-width:600px){.footballer-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px}}
.passing-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.passing-card{background:#fff;border:5px solid var(--border-dark);border-radius:30px;padding:40px;max-width:450px;width:100%;text-align:center;animation:scale-in .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px 40px #00000040,inset 0 -5px #0000001a}
.pass-icon{font-size:80px;margin-bottom:15px;animation:bounce 1.5s ease-in-out infinite;filter:drop-shadow(0 5px 10px rgba(0,0,0,.2))}
.passing-card h2{font-size:32px;color:var(--accent-blue);margin:0 0 10px;text-shadow:2px 2px 0 var(--bg-secondary)}
.pass-instruction{font-size:16px;color:var(--text-secondary);margin-bottom:25px;font-weight:600}
.pass-instruction strong{color:var(--accent-green);font-weight:800}
.privacy-notice{background:var(--bg-secondary);border:3px solid var(--border-dark);border-radius:16px;padding:20px;margin-bottom:25px;box-shadow:0 4px #6b3000}
.lock-icon{font-size:32px;display:block;margin-bottom:10px}
.privacy-notice p{margin:0;color:var(--text-muted);font-size:13px;font-weight:600}
.ready-btn{width:100%;padding:20px;font-size:18px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:2px;background:linear-gradient(180deg,var(--accent-green),#388e3c);color:#fff;border:4px solid #1b5e20;border-radius:16px;cursor:pointer;transition:all .3s ease;box-shadow:0 6px #1b5e20,0 10px 25px #4caf5066;animation:pulse-glow 2s ease infinite}
.ready-btn:hover{transform:translateY(-4px);box-shadow:0 10px #1b5e20,0 15px 35px #4caf5080}
.ready-btn:active{transform:translateY(2px);box-shadow:0 2px #1b5e20,0 5px 15px #4caf504d}
.turn-order{margin-top:25px}
.turn-order p{color:var(--text-muted);font-size:11px;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.player-dots{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.player-dot{padding:10px 18px;border-radius:25px;font-size:13px;font-weight:700;background:#fff;border:3px solid var(--border-dark);color:var(--text-muted);transition:all .3s ease;box-shadow:0 3px #6b3000}
.player-dot.active{background:linear-gradient(180deg,var(--accent-green),#388e3c);border-color:#1b5e20;color:#fff;box-shadow:0 3px #1b5e20,0 5px 15px #4caf5066;transform:scale(1.1)}
.guessing-screen{min-height:100vh;padding:15px;display:flex;flex-direction:column}
.guess-header{background:#fff;border:4px solid var(--border-dark);border-radius:20px;padding:20px;margin-bottom:15px;text-align:center;animation:slide-up .3s ease;box-shadow:0 6px #6b3000,0 10px 25px #0003}
.guess-header h2{margin:0 0 10px;color:var(--accent-yellow);font-size:26px;text-shadow:2px 2px 0 #e65100}
.guess-header p{margin:0;color:var(--text-secondary);font-size:14px;font-weight:600}
.guess-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:15px;padding:20px;background:linear-gradient(180deg,#2d5a3d,#1e4029);border:5px solid var(--border-dark);border-radius:20px;overflow-y:auto;max-height:calc(100vh - 320px);align-content:start;box-shadow:inset 0 0 50px #0000004d,0 8px #3d2814,0 12px 30px #0000004d}
.guess-confirmation{background:#fff;border:4px solid var(--accent-yellow);border-radius:20px;padding:20px;margin-top:15px;text-align:center;animation:scale-in .3s ease;box-shadow:0 6px #e65100,0 10px 25px #ffc1074d}
.guess-confirmation p{margin:0;color:var(--text-secondary);font-weight:600}
.guess-confirmation p strong{color:var(--accent-yellow);font-size:22px;font-family:var(--font-display);text-shadow:1px 1px 0 #e65100}
.guess-confirmation .warning{margin-top:12px;color:var(--accent-red);font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.guess-controls{display:flex;gap:12px;margin-top:15px}
.cancel-btn,.confirm-guess-btn{flex:1;padding:18px;font-size:15px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;border-radius:14px;cursor:pointer;transition:all .3s ease}
.cancel-btn{background:#fff;border:4px solid var(--border-dark);color:var(--text-secondary);box-shadow:0 5px #6b3000,0 8px 15px #00000026}
.cancel-btn:hover{transform:translateY(-3px);box-shadow:0 8px #6b3000,0 12px 25px #0003;border-color:var(--accent-red);color:var(--accent-red)}
.cancel-btn:active{transform:translateY(2px);box-shadow:0 2px #6b3000,0 4px 10px #0000001a}
.confirm-guess-btn{background:linear-gradient(180deg,var(--accent-green),#388e3c);color:#fff;border:4px solid #1b5e20;box-shadow:0 5px #1b5e20,0 8px 20px #4caf5066}
.confirm-guess-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px #1b5e20,0 12px 30px #4caf5080}
.confirm-guess-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px #1b5e20,0 4px 10px #4caf504d}
.confirm-guess-btn:disabled{background:#ccc;border-color:#999;color:#666;cursor:not-allowed;box-shadow:none}
@media(min-width:600px){.guess-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px}}
.game-over{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:linear-gradient(180deg,#1a1a2e,#16213e)}
.fireworks{position:fixed;inset:0;pointer-events:none;z-index:50}
.firework{position:absolute;width:6px;height:6px;animation:firework-launch 2s ease-out calc(var(--delay)) infinite}
.firework:nth-child(1){left:15%;top:40%}
.firework:nth-child(2){left:85%;top:35%}
.firework:nth-child(3){left:50%;top:25%}
.firework:nth-child(4){left:25%;top:30%}
.firework:nth-child(5){left:75%;top:45%}
.spark{position:absolute;width:4px;height:4px;background:#f0d048;border-radius:50%;animation:spark-burst 2s ease-out calc(var(--delay)) infinite;transform:rotate(var(--angle)) translateY(0);box-shadow:0 0 6px #f0d048,0 0 12px gold}
@keyframes firework-launch{0%{opacity:0}50%{opacity:1}to{opacity:0}}
@keyframes spark-burst{0%{transform:rotate(var(--angle)) translateY(0);opacity:0}20%{opacity:1}to{transform:rotate(var(--angle)) translateY(80px);opacity:0}}
.floating-stars{position:fixed;inset:0;pointer-events:none;z-index:40}
.floating-star{position:absolute;animation:star-float 3s ease-in-out infinite;opacity:.8}
@keyframes star-float{0%,to{transform:translateY(0) rotate(0);opacity:.6}50%{transform:translateY(-20px) rotate(180deg);opacity:1}}
.confetti-container{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:100}
.confetti-piece{position:absolute;top:-20px;animation:confetti-fall 4s linear infinite}
.confetti-piece.square{width:12px;height:12px;border-radius:2px}
.confetti-piece.rect{width:8px;height:16px;border-radius:2px}
.confetti-piece.circle{width:10px;height:10px;border-radius:50%}
@keyframes confetti-fall{0%{transform:translateY(-10px) rotate(0) scale(1);opacity:1}to{transform:translateY(100vh) rotate(720deg) scale(.5);opacity:0}}
.game-over-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:4px solid #c9a227;border-radius:24px;padding:40px;max-width:550px;width:100%;text-align:center;animation:card-entrance .6s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:10;box-shadow:0 15px 50px #00000080,0 0 40px #c9a2274d,inset 0 1px #ffffff1a;overflow:hidden}
@keyframes card-entrance{0%{opacity:0;transform:scale(.8) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
.game-over-card:before{content:"";position:absolute;top:0;left:0;right:0;height:35%;background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,transparent 100%);pointer-events:none;border-radius:20px 20px 0 0;z-index:0}
.trophy-container{position:relative;margin-bottom:15px;display:inline-block}
.trophy-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;background:radial-gradient(circle,rgba(240,208,72,.4) 0%,transparent 70%);animation:trophy-glow-pulse 2s ease-in-out infinite}
@keyframes trophy-glow-pulse{0%,to{transform:translate(-50%,-50%) scale(1);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.3);opacity:1}}
.trophy-icon{position:relative;z-index:2;animation:trophy-bounce 1s ease infinite;filter:drop-shadow(0 10px 20px rgba(240,208,72,.5))}
@keyframes trophy-bounce{0%,to{transform:translateY(0)}50%{transform:translateY(-10px)}}
.trophy-rays{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:150px;height:150px;background:conic-gradient(from 0deg,transparent,rgba(240,208,72,.2),transparent,rgba(240,208,72,.2),transparent,rgba(240,208,72,.2),transparent,rgba(240,208,72,.2),transparent);animation:rays-spin 10s linear infinite;z-index:1}
@keyframes rays-spin{0%{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.game-over-card h1{font-family:var(--font-display);font-size:48px;color:#f0d048;margin:10px 0;text-shadow:0 0 20px rgba(240,208,72,.5),0 4px 0 #8b7419;letter-spacing:4px;position:relative;z-index:1}
.winner-name{font-family:var(--font-display);font-size:32px;font-weight:700;color:#4caf50;margin-bottom:25px;text-shadow:0 2px 10px rgba(76,175,80,.5);position:relative;z-index:1}
.reveal-section{background:#ffffff0d;border:2px solid rgba(201,162,39,.3);border-radius:16px;padding:20px;margin-bottom:25px;position:relative;z-index:1}
.reveal-section>p{color:#f0d048b3;margin-bottom:20px;font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.reveals{display:flex;flex-direction:column;gap:15px}
.reveal-item{display:flex;flex-direction:column;align-items:center;gap:12px;animation:reveal-slide .5s ease backwards;background:#ffffff0d;padding:15px;border-radius:12px;border:1px solid rgba(201,162,39,.2);transition:all .3s ease}
.reveal-item.winner{background:#4caf5026;border-color:#4caf5080;box-shadow:0 0 20px #4caf5033}
.reveal-item:nth-child(1){animation-delay:.2s}
.reveal-item:nth-child(2){animation-delay:.4s}
.reveal-item:nth-child(3){animation-delay:.6s}
.reveal-item:nth-child(4){animation-delay:.8s}
@keyframes reveal-slide{0%{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.reveal-player{font-family:var(--font-display);font-weight:700;font-size:14px;color:#f0d048;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.crown{font-size:24px;animation:crown-wiggle 1s ease-in-out infinite}
@keyframes crown-wiggle{0%,to{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.reveal-card{display:flex;justify-content:center}
.game-over-buttons{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.play-again-btn{width:100%;padding:20px 30px;font-size:18px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:3px;background:linear-gradient(135deg,#c9a227,#f0d048);color:#1a1a2e;border:3px solid #a88b1f;border-radius:14px;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 5px #8b7419,0 10px 30px #c9a22766}
.play-again-btn:hover{transform:translateY(-4px);box-shadow:0 9px #8b7419,0 15px 40px #c9a22780}
.play-again-btn:active{transform:translateY(2px);box-shadow:0 2px #8b7419,0 5px 15px #c9a2274d}
.play-again-btn .btn-icon{font-size:24px;transition:transform .3s ease}
.play-again-btn:hover .btn-icon{animation:spin .5s ease}
@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}
.back-home-btn{width:100%;padding:16px 30px;font-size:14px;font-weight:700;font-family:var(--font-body);text-transform:uppercase;letter-spacing:2px;background:transparent;color:#f0d048cc;border:2px solid rgba(201,162,39,.4);border-radius:12px;cursor:pointer;transition:all .3s ease}
.back-home-btn:hover{background:#c9a2271a;border-color:#c9a227;color:#f0d048;transform:translateY(-2px)}

@media(min-width:500px){.reveals{flex-direction:row;justify-content:center;flex-wrap:wrap;gap:15px}.reveal-item{flex:1;min-width:140px}}
.landing-page{min-height:100vh;overflow-x:hidden}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;padding:2rem;overflow:hidden}
.hero-background{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floating-ball{position:absolute;opacity:.2;animation:float 6s ease-in-out infinite;color:var(--text-secondary)}

.ball-2{top:20%;right:15%;animation-delay:1s}
.ball-3{bottom:20%;left:20%;animation-delay:2s}
.ball-4{bottom:30%;right:10%;animation-delay:3s}
.ball-5{top:40%;right:25%;animation-delay:4s}
.hero-content{text-align:center;max-width:800px;opacity:0;transform:translateY(30px);transition:all .8s cubic-bezier(.4,0,.2,1)}
.hero.animate .hero-content{opacity:1;transform:translateY(0)}
.logo-container{display:flex;flex-direction:column;align-items:center;gap:1rem;margin-bottom:1.5rem}

.tagline{font-size:clamp(1rem,3vw,1.5rem);color:var(--text-secondary);font-weight:600;margin-bottom:2rem;max-width:500px;margin-left:auto;margin-right:auto}
.hero-stats{display:flex;justify-content:center;align-items:center;gap:2rem;margin-bottom:3rem;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center}

.scroll-indicator{display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--text-muted);font-weight:600;animation:float 3s ease-in-out infinite}

.games-section{padding:4rem 2rem;background:linear-gradient(180deg,transparent 0%,rgba(255,255,255,.3) 50%,transparent 100%)}
.section-header{text-align:center;margin-bottom:3rem}

.games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem;max-width:1200px;margin:0 auto}
.game-card{background:#fff;border-radius:24px;padding:2rem;position:relative;overflow:hidden;transition:all .3s ease;border:4px solid var(--border-dark);box-shadow:0 8px 30px #00000026,inset 0 -4px #0000000d;cursor:pointer}

.game-card-icon{position:relative;width:80px;height:80px;margin-bottom:1rem;display:flex;align-items:center;justify-content:flex-start}

.game-card-title{font-family:var(--font-display);font-size:1.75rem;color:var(--text-primary);margin-bottom:.25rem}
.game-card-subtitle{font-size:.9rem;color:var(--accent-red);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.75rem}

.game-card-features{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}

.features-section{padding:4rem 2rem}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.5rem;max-width:1000px;margin:0 auto}
.feature-card{background:#fff;border-radius:20px;padding:1.5rem;text-align:center;border:3px solid var(--border-dark);box-shadow:0 4px 15px #0000001a;transition:transform .3s ease;position:relative;overflow:hidden}

.feature-card h3{font-family:var(--font-display);font-size:1.1rem;color:var(--text-primary);margin-bottom:.5rem;text-transform:none}
.feature-card p{font-size:.9rem;color:var(--text-muted);line-height:1.4}
.landing-footer{padding:3rem 2rem;background:linear-gradient(180deg,transparent,rgba(0,0,0,.05))}
.footer-content{text-align:center}
.footer-logo{display:flex;align-items:center;justify-content:center;gap:.5rem;font-family:var(--font-display);font-size:1.5rem;color:var(--text-primary);margin-bottom:.5rem}

.sb-details-card{width:160px;height:220px;margin:0 auto 20px;background:linear-gradient(165deg,#c9a227,#f0d048,#e8c84a 30%,#c9a227,#a88b1f 70%,#c9a227);border-radius:12px;position:relative;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 30px #00000080,0 0 40px #c9a2274d,inset 0 2px #fff6,inset 0 -2px #0003;border:2px solid #a88b1f;overflow:hidden}
.sb-details-card-bg{position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,transparent 100%);pointer-events:none}
.sb-details-rating{position:absolute;top:12px;left:14px;font-family:var(--font-display);font-size:32px;font-weight:700;color:#1a1a2e;line-height:1;text-shadow:0 1px 2px rgba(255,255,255,.3)}
.sb-details-position{position:absolute;top:46px;left:14px;font-size:14px;font-weight:700;color:#1a1a2e;text-transform:uppercase}
.sb-details-face{width:100px;height:100px;border-radius:8px;overflow:hidden;margin-top:20px;background:linear-gradient(180deg,#e8d5a3,#c9a227);position:relative;z-index:1}
.sb-details-face img{width:100%;height:100%;object-fit:cover;object-position:top center}
.sb-details-name{font-family:var(--font-display);font-size:14px;font-weight:700;color:#1a1a2e;text-transform:uppercase;margin-top:8px;text-align:center;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-details-flag{width:32px;height:22px;border-radius:3px;margin-top:6px;box-shadow:0 2px 4px #0003}
.sb-details-info{background:#0000004d;border-radius:12px;padding:12px;margin-bottom:16px}
.sb-details-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-details-row:last-child{border-bottom:none}
.sb-details-label{font-size:12px;color:#fff9;text-transform:uppercase;letter-spacing:.5px}
.sb-details-value{font-size:14px;color:#fff;font-weight:600}
.sb-details-value.rating{color:#f0d048;font-family:var(--font-display);font-size:18px}
.sb-change-btn{width:100%;margin-top:8px}
.app{min-height:100vh;width:100%;max-width:600px;margin:0 auto}
@media(min-width:768px){.app{max-width:800px}}</style>
