.result-content h2{font-size:28px;font-weight:700;color:#fff;margin:0 0 8px}
.result-content>p{font-size:15px;color:#fff9;margin:0 0 32px}
.result-reveal{display:flex;gap:16px;margin-bottom:32px}
.reveal-card{flex:1;background:#ffffff0d;border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.reveal-label{font-size:11px;color:#ffffff80;text-transform:uppercase;letter-spacing:.5px}
.reveal-card img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.reveal-name{font-size:13px;font-weight:600;color:#fff}
.result-actions{display:flex;flex-direction:column;gap:12px}
.question-modal{width:100%;max-width:400px;max-height:80vh;background:#1e1e32;border-radius:24px 24px 0 0;padding:24px 20px;padding-bottom:calc(env(safe-area-inset-bottom,20px) + 20px);animation:slideUp .3s ease-out;overflow-y:auto}
@keyframes slideUp{0%{transform:translateY(100%)}to{transform:translateY(0)}}
.question-modal h2{font-size:20px;font-weight:600;color:#fff;text-align:center;margin:0 0 20px}
.category-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.category-btn{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#ffffff0d;border:none;border-radius:14px;font-size:16px;font-weight:500;color:#fff;cursor:pointer;transition:all .2s}
.category-btn svg{width:20px;height:20px;color:#fff6}
.category-btn:active{background:#ffffff1a}
.value-selection h3{font-size:16px;font-weight:600;color:#fff;margin:16px 0;text-align:center}
.back-to-categories{display:flex;align-items:center;gap:8px;background:none;border:none;color:#667eea;font-size:14px;font-weight:500;cursor:pointer;padding:8px 0}
.back-to-categories svg{width:18px;height:18px}
.value-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.value-btn{padding:10px 16px;background:#ffffff14;border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:14px;color:#fff;cursor:pointer;transition:all .2s}
.value-btn:active{background:#667eea;border-color:#667eea}
.boolean-options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.boolean-options button{padding:16px;background:#ffffff14;border:1px solid rgba(255,255,255,.1);border-radius:14px;font-size:15px;font-weight:500;color:#fff;cursor:pointer;transition:all .2s}
.boolean-options button:active{background:#667eea;border-color:#667eea}
.modal-cancel{width:100%;padding:14px;background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#ffffffb3;font-size:15px;font-weight:500;cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:#000000b3;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media(min-width:768px){.game-screen{max-width:480px;margin:0 auto;border-left:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.05)}.player-grid{grid-template-columns:repeat(5,1fr)}.player-grid.selection{grid-template-columns:repeat(4,1fr)}}
.app{min-height:100vh;min-height:100dvh;width:100%;background:#0f0f23;overflow-x:hidden}
html,body{overscroll-behavior:none}
.app>*{animation:fadeIn .2s ease-out}
@keyframes fadeIn{0%{opacity:0}to{opacity:1}}</style>
